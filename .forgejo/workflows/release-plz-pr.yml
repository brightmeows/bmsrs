name: Release-plz PR

on:
  push:
    branches: [main]

jobs:
  release-plz-pr:
    name: Prepare release PR
    runs-on: codeberg-tiny

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          # Full history is required by release-plz to determine version bumps
          # based on conventional commits.
          fetch-depth: 0
          # release-plz uses the git-token explicitly; no need to persist.
          persist-credentials: false

      - name: Restore Rust toolchain cache
        id: cache-rustup
        uses: https://data.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ runner.os }}-stable

      - name: Install Rust toolchain
        id: rust
        uses: https://codeberg.org/wackbyte/rust-toolchain@trunk
        with:
          toolchain: stable
          profile: minimal

      - name: Save Rust toolchain cache
        uses: https://data.forgejo.org/actions/cache/save@v4
        if: success() && steps.cache-rustup.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ runner.os }}-stable

      - name: Install release-plz
        run: |
          curl -fsSL \
            "https://github.com/release-plz/release-plz/releases/latest/download/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/release-plz.tar.gz
          tar xzf /tmp/release-plz.tar.gz -C /tmp
          install /tmp/release-plz /usr/local/bin/ 2>/dev/null || \
            install /tmp/release-plz-*/release-plz /usr/local/bin/

      - name: Configure git user
        run: |
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"

      - name: Create or update release PR
        run: |
          release-plz release-pr \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
