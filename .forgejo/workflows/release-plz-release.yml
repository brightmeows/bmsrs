name: Release-plz Release

on:
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Publish crates and create release
    runs-on: codeberg-medium
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore cargo cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            rust-${{ runner.os }}-

      - name: Install release-plz and cargo-semver-checks
        run: |
          cargo binstall --no-confirm \
            release-plz@0.3.159 \
            cargo-semver-checks@0.48

      - name: Publish crates and create release
        run: |
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          release-plz release \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
