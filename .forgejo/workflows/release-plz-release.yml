name: Release-plz Release

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml']
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Publish crates and create release
    runs-on: codeberg-small
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check if release is needed
        id: check-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)

          if [ -z "$LATEST_TAG" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "${LATEST_TAG#v}" != "$VERSION" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Rust version
        if: steps.check-release.outputs.needed == 'true'
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Restore cargo registry
        if: steps.check-release.outputs.needed == 'true'
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-

      - name: Restore cargo target
        if: steps.check-release.outputs.needed == 'true'
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: target
          key: rust-target-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Install release-plz and publish crates
        if: steps.check-release.outputs.needed == 'true'
        run: |
          echo "::group::Install release-plz"
          cargo binstall --no-confirm release-plz@0.3.159
          echo "::endgroup::"

          echo "::group::Configure git"
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          echo "::endgroup::"

          echo "::group::Run release-plz release"
          release-plz release \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
          echo "::endgroup::"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
