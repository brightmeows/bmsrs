[workspace]
# Repository URL for changelog links and PR creation.
# Auto-detected from git remote; explicit for safety.
repo_url = "https://github.com/brightmeows/bmsrs"

# Enable semver checks for early detection of breaking API changes.
# (On 0.x, cargo-semver-checks flags any public API change as
# semver-incompatible, which is expected.)
semver_check = true

# Generate per-crate CHANGELOG.md on each release PR.
changelog_update = true

[changelog]
# Group conventional commits into descriptive sections.
# Covers standard conventional commit types beyond the default set
# (which lumps everything except feat/fix into "Other").
commit_parsers = [
    # Merge commits repeat the PR-branch commit subject with a "(#N)"
    # suffix (rewritten into a PR link by the release-plz default
    # preprocessor). Skipping them keeps one changelog entry per change
    # instead of one per commit.
    { message = "\\(#\\d+\\)", skip = true },
    # Secret-scrubbing placeholders leaked into commit subjects; the
    # garbled entries describe internal CI operations and carry no
    # user-facing information.
    { message = "Redacted", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Testing" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "CI" },
    { message = "^security", group = "Security" },
    { message = "^deprecated", group = "Deprecations" },
    { message = "^revert", group = "Reverts" },
    { message = "^.*", group = "Other" },
]

# Body template: the release-plz Keep a Changelog default, plus inline
# migration notes. Breaking commits render their `BREAKING CHANGE:` footer
# (exposed as `breaking_description`) as "(migration: ...)" when it differs
# from the subject. Keep the footer a single line so the entry stays readable.
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} (migration: {{ commit.breaking_description }}){% endif %}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} (migration: {{ commit.breaking_description }}){% endif %}
{% endif -%}
{% endfor -%}
{% endfor %}"""
