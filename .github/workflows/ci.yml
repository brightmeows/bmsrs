name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel incomplete old checks on a new push to the same branch so runner time
# is not wasted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system headers
        # The Linux backend of kira/cpal depends on alsa-sys (needs ALSA headers);
        # since kira 0.12.5 the dependency tree pulls in libdbus-sys (needs D-Bus
        # headers). The runner image does not include them by default.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Restore cargo registry
        uses: actions/cache@v6
        with:
          # The registry cache key matches release-plz-pr.yml exactly, so the two
          # workflows reuse each other's cache.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-
      - name: Restore cargo target
        uses: actions/cache@v6
        with:
          # deps/ and .fingerprint/: dependency artifacts and build fingerprints;
          # a hit skips recompiling dependencies.
          path: |
            target/debug/deps
            target/debug/.fingerprint
          key: rust-target-clippy-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-clippy-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Restore cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-
      - name: Restore cargo target
        uses: actions/cache@v6
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
          key: rust-target-doc-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-doc-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --quiet

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libdbus-1-dev
      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Restore cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-
      - name: Restore cargo target
        uses: actions/cache@v6
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
          key: rust-target-test-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-test-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - run: cargo test --workspace --quiet

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-binstall
        # Same install script as release-plz-pr.yml; cargo-deny is pinned to minor
        # 0.20, consistent with release-plz pinning cargo-semver-checks@0.48.
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Restore cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-
      - name: Restore advisory database
        uses: actions/cache@v6
        with:
          # OSV/advisory-db cache for cargo-deny; a hit still gets incremental
          # updates on each run. The path matches deny.toml's db-path.
          path: ~/.cargo/advisory-db
          key: rust-advisory-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-advisory-${{ runner.os }}-
      - run: |
          cargo binstall --no-confirm cargo-deny@0.20
          cargo deny check

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The toolchain version must stay in sync with
      # workspace.package.rust-version; guard-style let-chains (if_let_guard)
      # stabilized in Rust 1.95.0.
      - uses: dtolnay/rust-toolchain@1.95
      - name: Install system headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libdbus-1-dev
      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Restore cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-
      - name: Restore cargo target
        uses: actions/cache@v6
        with:
          path: |
            target/debug/deps
            target/debug/.fingerprint
          key: rust-target-msrv-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-msrv-${{ runner.os }}-${{ env.RUST_VERSION }}-
      # resolver "3" is rust-version aware: if a dependency raises the MSRV above
      # the declared value, resolution fails here, blocking upgrades that would
      # break MSRV users.
      - run: cargo check --workspace --all-targets --quiet
