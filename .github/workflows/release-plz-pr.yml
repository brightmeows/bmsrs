name: Release-plz PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-pr:
    name: Prepare release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history is required by release-plz to determine version bumps
          # based on conventional commits.
          fetch-depth: 0
          # Persist credentials so git push (called by release-plz) can authenticate.
          persist-credentials: true

      - name: Install Rust toolchain
        # GitHub hosted runners do not ship a Rust toolchain; the Codeberg
        # variant relied on a container image instead.
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        # The Codeberg container image bundled it; GitHub runners do not.
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Restore cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-

      - name: Restore cargo target
        uses: actions/cache@v4
        with:
          # 各子目录理由：
          #   deps/         — registry 依赖的 .rlib/.rmeta，源码路径稳定，编译指纹一致，可重用
          #   .fingerprint/ — cargo 依赖它的指纹判定 freshness，缺了即使有 .rlib 也会重编
          #   semver-checks — 基线版本的 rustdoc JSON，版本不变就不会变，免去每次重新生成
          path: |
            target/debug/deps
            target/debug/.fingerprint
            target/semver-checks
          key: rust-target-pr-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-pr-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Install release-plz and prepare release PR
        # Uses cargo-binstall — installed in the step above.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: 0
        run: |
          echo "::group::Install release-plz + cargo-semver-checks"
          cargo binstall --no-confirm release-plz@0.3.159 cargo-semver-checks@0.48
          echo "::endgroup::"

          echo "::group::Configure git"
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          echo "::endgroup::"

          echo "::group::Run release-plz release-pr"
          release-plz release-pr \
            --forge github \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
          echo "::endgroup::"
