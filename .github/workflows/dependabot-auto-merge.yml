name: Dependabot Auto-Merge
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 只处理 Dependabot 的 PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Skip major updates
        # major 留人工：semver 不是风险模型，必过检查抓不到运行时行为变化，
        # 构建工具与框架的 major 尤其。跳过时 PR 保持打开等手动合并；特定
        # 依赖的挂起版本用 dependabot.yml 的 ignore 挡在 PR 开出之前，与本
        # 闸门互补。major 的安全更新同样留人工，宁多看一眼。
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "major bump on ${{ steps.metadata.outputs.dependency-names }}, leaving for manual merge"

      - name: Enable auto-merge
        # patch/minor 与安全更新自动合并。等待由 GitHub 服务端承担：ruleset
        # 的必过检查全过后自动执行合并，不在 runner 上轮询（那会引入 600s
        # 超时失败模式与多 run 启用竞态）。版本缺失等未知形态（update-type
        # 为空）按非 major 放行，不卡队列。
        # 仓库仅允许 merge commit（allow_squash_merge=false），故用 --merge。
        # PR 有冲突时启用会失败，dependabot rebase 触发 synchronize 后重试。
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          [ "$enabled" = "true" ] || gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
