name: Dependabot Auto-Merge
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only handle Dependabot PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Skip major updates
        # Major updates stay manual: semver is not a risk model, and required
        # checks cannot catch runtime behavior changes, especially for build tools
        # and frameworks. When skipped, the PR stays open for manual merge;
        # pending versions of specific dependencies are blocked earlier by
        # dependabot.yml's ignore rules, complementing this gate. Major security
        # updates also stay manual; one extra look is worth it.
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "major bump on ${{ steps.metadata.outputs.dependency-names }}, leaving for manual merge"

      - name: Enable auto-merge
        # Patch/minor and security updates merge automatically. Waiting is handled
        # by GitHub's server: once the ruleset's required checks pass, the merge
        # runs automatically without polling on the runner (which would introduce
        # a 600s timeout failure mode and races between runs). Unknown shapes such
        # as missing update-type are treated as non-major and do not block the
        # queue.
        # The repository only allows merge commits (allow_squash_merge=false), so
        # --merge is used. Enabling fails when the PR has conflicts; retry after
        # dependabot rebase triggers synchronize.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          [ "$enabled" = "true" ] || gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
