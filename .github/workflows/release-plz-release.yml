name: Release-plz Release

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-plz-release:
    name: Publish crates and create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check if release is needed
        id: check-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)

          if [ -z "$LATEST_TAG" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "${LATEST_TAG#v}" != "$VERSION" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.check-release.outputs.needed == 'true'
        # GitHub hosted runners do not ship a Rust toolchain; the Codeberg
        # variant relied on a container image instead.
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        if: steps.check-release.outputs.needed == 'true'
        # The Codeberg container image bundled it; GitHub runners do not.
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Get Rust version
        if: steps.check-release.outputs.needed == 'true'
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Restore cargo registry
        if: steps.check-release.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-reg-${{ runner.os }}-

      - name: Restore cargo target
        if: steps.check-release.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: target
          key: rust-target-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Install release-plz and publish crates
        if: steps.check-release.outputs.needed == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: 0
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "::group::Install release-plz + cargo-semver-checks"
          cargo binstall --no-confirm release-plz@0.3.159 cargo-semver-checks@0.48
          echo "::endgroup::"

          echo "::group::Configure git"
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          echo "::endgroup::"

          echo "::group::Run release-plz release"
          release-plz release \
            --forge github \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
          echo "::endgroup::"
