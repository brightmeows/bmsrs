version: 2
updates:
  - package-ecosystem: "cargo"
    # Cargo workspaces resolve member manifests through the root; pointing
    # Dependabot at member directories fails every cargo update run with
    # dependency_file_not_resolvable.
    directories:
      - "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 20
    ignore:
      # dtolnay/rust-toolchain@<version> in ci.yml mirrors
      # workspace.package.rust-version (the MSRV); the two must be updated
      # manually together. If dependabot drifts this reference independently, the
      # msrv job checks the wrong target.
      - dependency-name: "dtolnay/rust-toolchain"
