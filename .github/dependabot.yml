version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "bms/*"
      - "bmson/*"
      - "common/*"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 20
    ignore:
      # ci.yml 的 dtolnay/rust-toolchain@<版本> 是 workspace.package.rust-version
      # （MSRV）的镜像，两处必须随 MSRV 调整手动同步；dependabot 单独漂移
      # 该引用会让 msrv job 检查错对象
      - dependency-name: "dtolnay/rust-toolchain"
