repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --quiet
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --workspace --no-deps --quiet
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-decorative-dividers
        name: no decorative comment dividers
        entry: bash -c '! rg -l "^\s*//\s*[-=]{2,}\s*$" "$@"' _
        language: system
        types: [rust]
