# Test concessions
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Disallowed sync fs methods (use tokio::fs instead)
disallowed-methods = [
  { path = "std::fs::read", reason = "use tokio::fs::read" },
  { path = "std::fs::write", reason = "use tokio::fs::write" },
  { path = "std::fs::read_to_string", reason = "use tokio::fs::read_to_string" },
  { path = "std::fs::remove_file", reason = "use tokio::fs::remove_file" },
  { path = "std::fs::remove_dir_all", reason = "use tokio::fs::remove_dir_all" },
  { path = "std::fs::create_dir", reason = "use tokio::fs::create_dir" },
  { path = "std::fs::create_dir_all", reason = "use tokio::fs::create_dir_all" },
  { path = "std::fs::rename", reason = "use tokio::fs::rename" },
  { path = "std::fs::metadata", reason = "use tokio::fs::metadata" },
  { path = "std::fs::copy", reason = "use tokio::fs::copy" },
  { path = "std::fs::canonicalize", reason = "use tokio::fs::canonicalize" },
  { path = "std::fs::File::open", reason = "use tokio::fs::File::open (or into_std in spawn_blocking)" },
  { path = "std::fs::File::create", reason = "use tokio::fs::File::create (or into_std in spawn_blocking)" },
  { path = "std::thread::spawn", reason = "use tokio::spawn or tokio::task::spawn_blocking" },
  { path = "std::mem::zeroed", reason = "use MaybeUninit" },
  { path = "alloc::boxed::Box::leak", reason = "memory leak; restructure to avoid 'static promotion of borrowed data" },
  { path = "alloc::string::String::leak", reason = "memory leak; restructure to avoid 'static promotion of borrowed data" },
]

# Disallowed sync types (use tokio variants when held across .await)
disallowed-types = [
  { path = "std::borrow::Cow", reason = "use separate borrowed/owned types instead of runtime dispatch" },
  { path = "std::sync::Mutex", reason = "use tokio::sync::Mutex (if held across .await) or OnceLock" },
  { path = "std::sync::RwLock", reason = "use tokio::sync::RwLock (if held across .await)" },
]

# Disallowed print/dbg macros (use tracing instead)
disallowed-macros = [
  { path = "std::println", reason = "use tracing::info!/warn!/error!" },
  { path = "std::eprintln", reason = "use tracing::info!/warn!/error!" },
  { path = "std::print", reason = "use tracing::info!/warn!/error!" },
  { path = "std::eprint", reason = "use tracing::info!/warn!/error!" },
  { path = "std::dbg", reason = "remove before commit" },
  { path = "std::todo", reason = "implement or use tracing::warn! for incomplete paths" },
]
