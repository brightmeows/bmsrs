[package]
name = "bmsrs"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bms-tokenizer = { path = "bms/tokenizer" }
bms-control-flow = { path = "bms/control-flow" }
bms-parser = { path = "bms/parser" }
bmson-def = { path = "bmson/def" }

[workspace]
resolver = "3"
members = [
    "bms/tokenizer",
    "bms/tokenizer-derive",
    "bms/control-flow",
    "bms/parser",
    "bms/processor",
    "bmson/def",
    "bmson/de-chumsky",
    "bmson/processor",
    "core/chart",
    "player",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "BMS/BMSON format parsing, processing and playback toolkit"
repository = "https://codeberg.org/brightmeows/bmsrs"
authors = ["白喵斯 <brightmeows@163.com>"]
homepage = "https://codeberg.org/brightmeows/bmsrs"
keywords = ["bms", "bmson", "rhythm-game", "music-game"]
categories = ["multimedia::encoding", "game::development"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
bmson-def = { path = "bmson/def" }
chumsky = { version = "0.12", features = ["serde"] }
serde_json = "1"

[workspace.lints.rust]
dead_code = "deny"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"

[workspace.lints.clippy]
# === Restriction (cherry-pick: prevent risky API usage) ===
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_docs_in_private_items = "deny"
mod_module_files = "deny"
macro_use = "deny"
pub_use = "allow"

# === Pedantic (strict, occasional false positives) ===
pedantic = { level = "deny", priority = -1 }
