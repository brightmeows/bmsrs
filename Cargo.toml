[workspace]
resolver = "3"
members = [
    "bmsrs",
    "bms/tokenizer",
    "bms/tokenizer-derive",
    "bms/control-flow",
    "bms/parser",
    "bms/processor",
    "bmson/def",
    "bmson/de-chumsky",
    "bmson/processor",
    "common/chart",
    "common/player",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "BMS/BMSON format parsing, processing and playback toolkit"
repository = "https://codeberg.org/brightmeows/bmsrs"
authors = ["白喵斯 <brightmeows@163.com>"]
homepage = "https://codeberg.org/brightmeows/bmsrs"
keywords = ["bms", "bmson", "rhythm-game", "music-game"]
categories = ["multimedia::encoding", "game::development"]
rust-version = "1.85"
readme = "README.md"

[workspace.dependencies]
# External
serde = { version = "1", features = ["derive"] }
thiserror = "2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
chumsky = { version = "0.12", features = ["serde"] }
serde_json = "1"
rand = { version = "0.10", default-features = false, features = ["std"] }

# Local (path)
bmson-def = { path = "bmson/def" }
bms-tokenizer = { path = "bms/tokenizer" }
bms-control-flow = { path = "bms/control-flow" }
bms-parser = { path = "bms/parser" }
bms-tokenizer-derive = { path = "bms/tokenizer-derive" }
bmsrs-chart = { path = "common/chart" }
bmson-processor = { path = "bmson/processor" }
bms-processor = { path = "bms/processor" }
bmsrs-player = { path = "common/player" }

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
unused_crate_dependencies = "allow"
unused_extern_crates = "deny"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_doc_tests = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
# === Restriction (Applicability: MachineApplicable) ===
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
doc_include_without_cfg = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
non_zero_suggestions = "deny"
precedence_bits = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
str_to_string = "deny"

# === Restriction (Applicability: MaybeIncorrect) ===
decimal_literal_representation = "deny"
empty_drop = "deny"
mutex_atomic = "deny"
unnecessary_self_imports = "deny"

# === Restriction (Applicability: HasPlaceholders) ===
float_cmp_const = "deny"
unnecessary_safety_comment = "deny"

# === Restriction (Applicability: MachineApplicable) ===
unnecessary_safety_doc = "deny"

# === Restriction (Applicability: Unspecified) ===
empty_structs_with_brackets = "deny"
for_kv_map = "deny"
get_unwrap = "deny"
items_after_test_module = "deny"
let_underscore_must_use = "deny"
shadow_reuse = "warn"
shadow_same = "warn"
exit = "deny"
expect_used = "warn"
indexing_slicing = "warn"
let_underscore_untyped = "deny"
missing_docs_in_private_items = "deny"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_use = "allow"
rc_buffer = "deny"
redundant_type_annotations = "deny"
shadow_unrelated = "deny"
string_add = "deny"
string_slice = "deny"
tests_outside_test_module = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "warn"
verbose_file_reads = "deny"

# === Restriction (Applicability: MachineApplicable) ===
missing_assert_message = "deny"
try_err = "deny"

# === Nursery (Applicability: MachineApplicable) ===
derive_partial_eq_without_eq = "deny"
missing_const_for_fn = "deny"
needless_collect = "deny"
nonstandard_macro_braces = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
search_is_some = "deny"
string_lit_as_bytes = "deny"
suspicious_operation_groupings = "deny"
unnecessary_struct_initialization = "deny"
unused_rounding = "deny"
use_self = "deny"

# === Nursery (Applicability: MaybeIncorrect) ===
iter_with_drain = "deny"
option_if_let_else = "deny"
significant_drop_in_scrutinee = "deny"

# === Nursery (Applicability: HasPlaceholders) ===
or_fun_call = "deny"

# === Nursery (Applicability: Unspecified) ===
branches_sharing_code = "deny"
future_not_send = "deny"
iter_on_single_items = "deny"
missing_fields_in_debug = "deny"
suboptimal_flops = "deny"

# === Nursery (Applicability: MachineApplicable) ===
clear_with_drain = "deny"

# === Nursery (Applicability: MaybeIncorrect) ===
significant_drop_tightening = "deny"

# === Cargo (Applicability: Unspecified) ===
cargo_common_metadata = "deny"
negative_feature_names = "deny"
redundant_feature_names = "deny"
wildcard_dependencies = "deny"

# === Pedantic (strict, occasional false positives) ===
pedantic = { level = "deny", priority = -1 }
