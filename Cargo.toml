[workspace]
resolver = "2"
members = [
    "bms/tokenizer",
    "bms/parser",
    "bms/processor",
    "bmson/def",
    "bmson/de-chumsky",
    "bmson/ser",
    "bmson/processor",
    "core/chart",
    "player",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
dead_code = "deny"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
pub_use = "allow"
mod_module_files = "warn"
