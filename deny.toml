[graph]
all-features = false
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-pc-windows-gnu" },
]

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# unmaintained 是维护状态信号而非漏洞，不挡合并。cargo-deny 0.20 已移除
# per-category severity（vulnerability/unsound/unmaintained 一律 deny），
# 降级手段只剩作用域：置 none 完全跳过该类检查（连警告也不出）。
# macroquad 的 unsound 走条目豁免并写明理由，可随时撤
unmaintained = "none"
ignore = [
    { id = "RUSTSEC-2025-0035", reason = "macroquad 的多个 soundness 问题仅经 facade 的 dev 依赖进 examples（microquad_player）；0.4.x 无安全升级，示例仅本机演示运行，不进入发布产物" },
]

[licenses]
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT-0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
